# ---------------- Dentists (shown large, with biography) ----------------
# bio: separate paragraphs with one blank line.
# video: YouTube video ID (the part after v= in the link), or "" for none.

[[dentists]]
name = "Dr. Tom Karkanis"
role = "General Dentist"
photo = "Dr.-Tom-Karkanis.jpg"
video = "ghP9JCpCWBM"
bio = """
Dr. Tom Karkanis, General Dentist, has a passion for bringing dentistry to his patients, and is fuelled by his unique combination of dental experience (he’s a graduate of the University of Western Ontario’s Dental School), strong scientific background (he also has a PhD in Cellular Physiology), and facility with computer technology.

Dr. Karkanis provides all aspects of cosmetic, laser, and advanced restorative dentistry in his practice. His patients benefit from the many solutions he offers, including Invisalign® clear braces, and oral sedation.

Outside of his practice, Tom is an avid fan of music, Tom received his Performer’s Diploma in piano from London’s Trinity College in 1991, and in his free time also enjoys competitive gaming, skiing and squash.
"""

[[dentists]]
name = "Dr. Farid Habibian"
role = "General Dentist"
photo = "Dr.-Farid-Habibian.jpg"
video = ""
bio = """
Dr. Farid Habibian, Family Dentist, graduated from New York University College of Dentistry with Honors. After graduating, he started his general practice residency (GPR) at Lincoln Hospital in Bronx, NY, where he gained experience in advanced techniques and procedures in dentistry. After finishing his residency, Dr. Habibian moved to Vancouver to enjoy the west coast lifestyle.

He is a proud member of the Canadian Dental Association, American Dental Association, and BC Dental Association. Dr. Farid Habibian is very passionate about dentistry and enjoys providing patient-centered care to the local community. He attends focused study clubs regularly for continued education in dentistry. When not providing dental care, he is passionate about playing sports, especially volleyball. He loves cooking, trying different cuisines, and enjoys travelling.
"""

[[dentists]]
name = "Dr. Aaron Phan"
role = "General Dentist"
photo = "Dr.-Aaron-Phan.jpg"
video = ""
bio = """
Dr. Aaron Phan was born and raised in Calgary. He lived there his entire life before moving to Sydney Australia where he studied for 4 years and achieved his DMD. Through his time there, he has developed a special interest in oral surgery and general restorative work, but he aims to be a well-rounded general practitioner.

When dentistry isn’t on his mind, he’s probably thinking about what he’s going to eat for his next meal. He loves food! Dr. Phan enjoys cooking it as much as he does eating it, and he loves trying new dishes and cuisines. Dr. Phan also enjoys traveling, golfing, and is a huge hockey fan (He cheers for the Flames, sorry!). He’s a bit of a techie as well. Whether it be playing games to wind down or tinkering with his computer.
"""

[[dentists]]
name = "Dr. Markus Louie"
role = "General Dentist"
photo = "Dr-Markus-White-shirt.jpg"
video = ""
bio = """
Dr. Markus Louie was born and raised in the Lower Mainland where he attended the University of British Columbia for his undergraduate studies. He later attended the UBC dental school, where he received his Doctor of Dental Medicine.

During his time in school, he was able to experience many aspects of dentistry and took a special interest in restorative dentistry and oral surgery. There, he was awarded the American College of Prosthodontists Student Prosthodontic Achievement Award.

Dr. Markus is also proficient in diverse areas of dentistry, including root canal therapy, implant dentistry, and is passionate about delivering high quality care by keeping up to date with continuing education courses. He strives to ensure that every patient feels comfortable in his chair.

On his off days, he enjoys golf, cooking, and snowboarding in the winter.
"""

