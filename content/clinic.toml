# =====================================================================
#  CLINIC DETAILS — edit this file to change information site-wide.
#  Everything here appears automatically in the header, footer, sidebars,
#  contact pages and structured data. Keep the quotes around values.
# =====================================================================

name = "Atlantis Dental Yaletown"
legal_name = "Atlantis Dental Centre"
tagline = "Tomorrow’s Dentistry – today!"

# The public web address of the site. Used for search-engine tags and the sitemap.
site_url = "https://atlantisdental.ca"
# true  = preview/demo: tells search engines NOT to index the site.
# false = live site (normal).
demo = false

# ---- Contact ----
phone = "(604) 899-0775"
phone_tel = "+16048990775"          # digits only, used for tap-to-call links
email = "yaletown@atlantisdental.ca"
address_1 = "1278 Pacific Boulevard"
address_2 = "Vancouver, BC V6Z 2V1"

# ---- Emergency line ----
emergency = "604-805-2500"
emergency_tel = "+16048052500"
emergency_hours = "7 AM – 1 AM"

# ---- Opening hours (shown in footer, sidebars, contact pages) ----
# day: 0 = Sunday, 1 = Monday … 6 = Saturday (used to highlight today)
