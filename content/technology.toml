[[items]]
heading = "Digital X-Rays"
icon = "sun"
text = """
Atlantis Dental use digital x-rays instead of traditional dental x-rays for a variety of beneficial reasons. To start with, digital x-rays are much safer than the traditional version, because they use up to 90% less radiation compared to film-based procedures used in the past. This is especially important for patients who need multiple x-rays. Furthermore, because the image is sent to a computer and not to a film, the results are instant and much clearer than traditional versions – so there’s no waiting around for processing. It’s also easy and safe to transfer images between computers, to specialists, and so on. Last but not least, no film equals no waste for the environment, which is why digital x-rays are a green solution, too!

To learn more about our digital x-rays or book an appointment, <a href="/contact-us/">contact us</a> today.
"""

[[items]]
heading = "Invisalign® Invisible Braces"
icon = "sparkle"
logo = "/assets/img/brand/Invisalign_Provider_Logo_web.png"
logo_alt = "Invisalign Provider"
text = """
With the aid of <a href="/invisalign/">Invisalign technology</a>, we are able to create impressions of your teeth, which will be digitized so that Dr. Karkanis can work with a computerized 3-D image and tooth positioning software. We use these digital images to create a series of comfortable and invisible aligner trays that are custom to your treatment outcome. These customized aligners are created for you to wear at each stage of your treatment, and are made without metal wires, brackets or bands – which makes them remarkably comfortable (especially compared to traditional metal braces!) and effective.

<a href="/contact-us/">Contact Atlantis Dental</a> today to achieve a straighter and healthier smile in only six to eight weeks!
"""

[[items]]
heading = "Velscope Examination System for Oral Cancer Screening"
icon = "shield"
side_image = "/assets/img/brand/velscope-1.jpg"
side_image_alt = "VELscope oral cancer screening device"
text = """
The Velscope system shines a blue light in the mouth that allows Dr. Karkanis to better see lesions such as cancer. If a lesion is found it is photographed under the blue light, measured, and followed up to make sure it is not serious.

<a href="/our-technology/velscope-oral-cancer-screening/">Learn more about VELscope</a>, or <a href="/contact-us/">contact us</a> to make an appointment to get your oral cancer screening today!
"""

